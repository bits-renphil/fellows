<!-- BiTS Mentors -- Squarespace Embed -->
<!-- INSTRUCTIONS:
     1. Paste this entire block into a Squarespace Code Block
     2. Headshots are served from GitHub (github.com/bits-renphil/mentors)
     3. Data comes from the published Google Sheet -- set CSV_URL below
        (Sheet -> File -> Share -> Publish to web -> CSV)
     4. Columns are matched by HEADER NAME, not position, so you can add or
        reorder columns in the sheet without touching this code. Required
        headers: Name | Affiliation | Cohorts | Experience | Bio | Areas | Headshot
     5. "Cohorts" is the multi-select answer, comma-separated exactly as the
        form exports it, e.g.  ARIA PDs, SPRIND 2025, Japan 2026
        Cohort tags and the Year filter are derived automatically from that string.
     6. FILTERS: mentors are organised by Area of expertise and by prior ARPA-style
        affiliation (read from the Experience column), not by cohort. Both filter
        lists are built automatically from the sheet -- add a new area or a new
        agency in the sheet and the pill/dropdown appears on its own.
     7. Bios are always visible. There is no expand/collapse toggle.
     8. CARD ORDER: headshot, name, affiliation, areas of expertise, previous ARPA
        role, bio, then cohort tags at the foot of the card.
     9. PHOTO CROP: add an optional column whose header contains "position",
        "crop" or "focal" (e.g. "Photo position"). Put a vertical figure in it --
        "20%" or "20" both work, as does a full value like "center 35%" or "top".
        Lower numbers show more of the top of the image. Leave blank for the
        default, center 22%.
-->

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
.bits-mentors {
  --bits-accent: #c45c2a;
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  color: inherit;
  line-height: 1.6;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1rem;
}

.bits-mentors__heading {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 3.5rem;
  font-weight: 400;
  letter-spacing: -0.02em;
  color: #1a1a1a;
  margin: 0 0 0.5rem;
  line-height: 1;
}

.bits-mentors__program-link {
  font-size: 0.85rem;
  margin: 0 0 1.75rem;
}

.bits-mentors__program-link a {
  color: var(--bits-accent);
  text-decoration: none;
}

.bits-mentors__program-link a:hover {
  text-decoration: underline;
}

.bits-mentors__filters {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  padding: 1rem 0;
  margin-bottom: 0;
}

.bits-mentors__filters--hidden {
  display: none;
}

.bits-mentors__filter-label {
  font-size: 0.9rem;
  font-weight: 700;
  margin-right: 0.25rem;
  opacity: 0.7;
}

.bits-mentors__pill {
  font-family: 'Inter', sans-serif;
  font-size: 0.82rem;
  font-weight: 500;
  padding: 0.35rem 0.9rem;
  border-radius: 100px;
  border: 1px solid rgba(0,0,0,0.12);
  background: transparent;
  color: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
  opacity: 0.7;
}

.bits-mentors__pill:hover {
  opacity: 1;
  border-color: rgba(0,0,0,0.25);
}

.bits-mentors__pill--active {
  background: var(--bits-accent);
  color: #fff;
  border-color: var(--bits-accent);
  opacity: 1;
}

.bits-mentors__pill:focus-visible,
.bits-mentors__select:focus-visible,
.bits-mentors__search:focus-visible {
  outline: 2px solid var(--bits-accent);
  outline-offset: 2px;
}

.bits-mentors__select,
.bits-mentors__search {
  font-family: 'Inter', sans-serif;
  font-size: 0.82rem;
  font-weight: 300;
  padding: 0.4rem 0.9rem;
  border-radius: 100px;
  border: 1px solid rgba(0,0,0,0.12);
  background: transparent;
  color: inherit;
  min-width: 240px;
  outline: none;
}

.bits-mentors__select:focus,
.bits-mentors__search:focus {
  border-color: var(--bits-accent);
}

.bits-mentors__count {
  font-size: 0.82rem;
  opacity: 0.5;
  padding: 0.5rem 0 1rem;
}

.bits-mentors__empty {
  display: none;
  text-align: center;
  padding: 3rem 1rem;
  opacity: 0.5;
  font-size: 0.95rem;
}

.bits-mentors__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2.5rem 2rem;
  align-items: start;
}

.bits-mentors__card {
  background: transparent;
  border: none;
  border-radius: 0;
  overflow: hidden;
}

.bits-mentors__card-top {
  display: block;
  padding: 1.25rem 1.25rem 0;
}

.bits-mentors__card-top img {
  width: 64%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  object-position: center 22%;
  display: block;
  margin: 0 auto;
  border-radius: 50%;
  transition: opacity 0.2s ease;
}

.bits-mentors__card:hover .bits-mentors__card-top img {
  opacity: 0.85;
}

.bits-mentors__name {
  font-size: 1.25rem;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  letter-spacing: -0.01em;
  margin: 1rem 0 0.15rem;
}

.bits-mentors__affiliation {
  font-size: 0.82rem;
  opacity: 0.55;
  display: block;
}

.bits-mentors__tags {
  display: flex;
  gap: 0.4rem;
  margin-top: 0.4rem;
  flex-wrap: wrap;
  justify-content: flex-start;
}

.bits-mentors__tag {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 0.15rem 0.5rem;
  border-radius: 3px;
  background: rgba(0,0,0,0.06);
  color: inherit;
  opacity: 0.55;
}

.bits-mentors__card-body {
  padding: 0.5rem 0 0;
}

.bits-mentors__experience {
  font-weight: 700;
  font-size: 0.88rem;
  margin-bottom: 0.3rem;
  opacity: 0.8;
}

/* areas of expertise sit under the affiliation, where cohorts used to be */
.bits-mentors__tag--area {
  text-transform: none;
  font-weight: 500;
  letter-spacing: 0;
  font-size: 0.72rem;
  background: transparent;
  border: 1px solid rgba(0,0,0,0.14);
  opacity: 0.7;
}

.bits-mentors__bio {
  font-size: 0.88rem;
  font-weight: 300;
  color: #6b6b6b;
  line-height: 1.6;
  margin: 0.35rem 0 0;
}

/* cohorts move to the foot of the card, where the bio link used to be */
.bits-mentors__card-footer {
  padding: 0.7rem 0 0;
}

.bits-mentors__card-footer .bits-mentors__tags {
  margin-top: 0;
}

@media (max-width: 900px) {
  .bits-mentors__grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 540px) {
  .bits-mentors__grid {
    grid-template-columns: 1fr;
    gap: 2rem;
  }
  .bits-mentors__select,
  .bits-mentors__search {
    min-width: 100%;
  }
}
</style>

<div class="bits-mentors">

  <h1 class="bits-mentors__heading">BiTS Mentors</h1>
  <p class="bits-mentors__program-link"><a href="https://www.renaissancephilanthropy.org/big-if-true-science-accelerator" target="_blank">Learn more about the program</a></p>

  <!-- Filter Bar -->
  <div class="bits-mentors__filters bits-mentors__filters--hidden" data-row="area">
    <span class="bits-mentors__filter-label">Area of expertise:</span>
    <select class="bits-mentors__select" data-filter="area" aria-label="Filter by area of expertise">
      <option value="all">All areas</option>
    </select>
  </div>
  <div class="bits-mentors__filters bits-mentors__filters--hidden" data-row="arpa">
    <span class="bits-mentors__filter-label">Previous ARPA:</span>
    <button class="bits-mentors__pill bits-mentors__pill--active" data-filter="arpa" data-value="all">All</button>
  </div>
  <div class="bits-mentors__filters">
    <span class="bits-mentors__filter-label">Year:</span>
    <button class="bits-mentors__pill bits-mentors__pill--active" data-filter="year" data-value="all">All</button>
    <button class="bits-mentors__pill" data-filter="year" data-value="2025">2025</button>
    <button class="bits-mentors__pill" data-filter="year" data-value="2026">2026</button>
  </div>
  <div class="bits-mentors__filters" style="border-bottom: 1px solid rgba(0,0,0,0.1); padding-top: 0;">
    <span class="bits-mentors__filter-label">Search:</span>
    <input type="search" class="bits-mentors__search" placeholder="Name, affiliation, or area of expertise" aria-label="Search mentors">
  </div>

  <div class="bits-mentors__count"></div>
  <div class="bits-mentors__empty">No mentors match the selected filters.</div>

  <!-- Card Grid -->
  <div class="bits-mentors__grid">

  </div>
</div>

<script>
(function() {
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaO2BmxltWEHcnVjF7YzBaLpv6zh_cgbGeKYzyNlZMsxylBXfJMYLA51Bm6By7VtF4R0m8x7Ta2wGL/pub?gid=965490016&single=true&output=csv';

  var root = document.querySelector('.bits-mentors');
  if (!root) return;

  var grid     = root.querySelector('.bits-mentors__grid');
  var countEl  = root.querySelector('.bits-mentors__count');
  var emptyEl  = root.querySelector('.bits-mentors__empty');
  var searchEl = root.querySelector('.bits-mentors__search');
  var areaRow  = root.querySelector('[data-row="area"]');
  var areaSel  = root.querySelector('.bits-mentors__select[data-filter="area"]');
  var arpaRow  = root.querySelector('[data-row="arpa"]');
  var filters  = { area: 'all', arpa: 'all', year: 'all', q: '' };
  var cards    = [];
  var areaIndex = {};   /* slug -> display label */

  /* -- CSV parser -- */
  function parseCSV(text) {
    var rows = [], row = [], field = '', inQ = false, i = 0;
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    while (i < text.length) {
      var c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i+1] === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += c; i++;
      } else {
        if (c === '"')  { inQ = true; i++; continue; }
        if (c === ',')  { row.push(field); field = ''; i++; continue; }
        if (c === '\n') { row.push(field); if (row.some(function(f){return f;})) rows.push(row); row = []; field = ''; i++; continue; }
        field += c; i++;
      }
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  /* -- escape HTML -- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function slugify(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  /* -- map columns by header name, so column order in the sheet doesn't matter.
        Fields are resolved most-specific-first and each column is claimed only
        once, so a header like "Areas of interest or experience" can't steal the
        "Previous ARPA experience" column. -- */
  var FALLBACK = ['name','affiliation','cohorts','experience','bio','areas','headshot','photopos'];
  var KEYS = [
    ['photopos',    ['position', 'crop', 'focal']],
    ['headshot',    ['headshot', 'photo', 'image']],
    ['affiliation', ['affiliation', 'organisation', 'organization']],
    ['cohorts',     ['cohort']],
    ['areas',       ['area', 'interest']],
    ['bio',         ['bio']],
    ['experience',  ['arpa', 'previous', 'experience']],
    ['name',        ['name']]
  ];
  function mapColumns(header) {
    var map = {}, claimed = {}, found = 0;
    for (var f = 0; f < KEYS.length; f++) {
      var field = KEYS[f][0], words = KEYS[f][1];
      for (var k = 0; k < words.length && map[field] === undefined; k++) {
        for (var c = 0; c < header.length; c++) {
          if (claimed[c]) continue;
          if (String(header[c]).toLowerCase().indexOf(words[k]) > -1) {
            map[field] = c; claimed[c] = true; found++; break;
          }
        }
      }
    }
    /* header row doesn't look like headers -> fall back to fixed column order */
    if (found < 3) {
      map = {};
      for (var i = 0; i < FALLBACK.length; i++) map[FALLBACK[i]] = i;
      return map;
    }
    for (var j = 0; j < FALLBACK.length; j++) {
      if (map[FALLBACK[j]] === undefined) map[FALLBACK[j]] = -1;
    }
    return map;
  }

  /* -- cohort string -> display tags + years (cohorts are shown, not filtered) -- */
  function parseCohorts(raw) {
    var tokens = String(raw || '').split(',')
      .map(function(t) { return t.trim(); })
      .filter(function(t) { return t.length; });
    var years = [];
    tokens.forEach(function(t) {
      var yr = t.match(/20\d{2}/);
      if (yr && years.indexOf(yr[0]) === -1) years.push(yr[0]);
    });
    return { tokens: tokens, years: years };
  }

  /* -- areas of expertise -> filter slugs.
        Free text in the sheet is split on commas, semicolons and slashes. -- */
  function parseAreas(raw) {
    var out = [];
    String(raw || '').split(/[,;\/]|\u2022/).forEach(function(t) {
      var label = t.replace(/\s+/g, ' ').trim()
                   .replace(/^and\s+/i, '')
                   .replace(/[.]+$/, '')
                   .trim();
      if (!label || label.length > 60) return;
      var slug = slugify(label);
      if (!slug || out.indexOf(slug) > -1) return;
      out.push(slug);
      if (!areaIndex[slug]) areaIndex[slug] = label.charAt(0).toUpperCase() + label.slice(1);
    });
    return out;
  }

  /* -- per-mentor headshot crop, from the sheet.
        Accepts "20%", "20", "center 20%", "top", "center 35%" etc.
        Anything unrecognised is ignored and the card falls back to the CSS default. -- */
  var DEFAULT_CROP = 'center 22%';
  function parseCrop(raw) {
    var v = String(raw || '').trim().toLowerCase();
    if (!v) return '';
    if (/^\d{1,3}(\.\d+)?%?$/.test(v)) return 'center ' + parseFloat(v) + '%';
    if (!/^[a-z0-9%.\s-]+$/.test(v)) return '';
    if (v.split(/\s+/).length > 2) return '';
    return v;
  }

  /* -- previous ARPA-style affiliation, read out of the Experience column -- */
  var AGENCIES = [
    ['DARPA', /\bdarpa\b/], ['IARPA', /\biarpa\b/], ['ARPA-E', /\barpa-?\s?e\b/],
    ['ARPA-H', /\barpa-?\s?h\b/], ['ARPA-I', /\barpa-?\s?i\b/], ['HSARPA', /\bhsarpa\b/],
    ['ARIA', /\baria\b/], ['SPRIND', /\bsprind\b/], ['JST', /\bjst\b/], ['NASA', /\bnasa\b/]
  ];
  function parseAgencies(text) {
    var low = String(text || '').toLowerCase(), out = [];
    AGENCIES.forEach(function(a) {
      if (a[1].test(low) && out.indexOf(a[0]) === -1) out.push(a[0]);
    });
    return out;
  }

  /* -- build a card from a CSV row -- */
  function buildCard(r, map) {
    function get(f) { var i = map[f]; return (i > -1 && r[i] != null) ? String(r[i]).trim() : ''; }

    var name = get('name');
    if (!name) return null;

    var affil    = get('affiliation');
    var cohorts  = parseCohorts(get('cohorts'));
    var exp      = get('experience');
    var bio      = get('bio');
    var areas    = get('areas');
    var headshot = get('headshot');
    var crop      = parseCrop(get('photopos')) || DEFAULT_CROP;
    var areaSlugs = parseAreas(areas);
    var agencies  = parseAgencies(exp);

    var cohortHtml = cohorts.tokens.map(function(t) {
      return '<span class="bits-mentors__tag">' + esc(t) + '</span>';
    }).join('');

    var areaHtml = areaSlugs.map(function(slug) {
      return '<span class="bits-mentors__tag bits-mentors__tag--area">' + esc(areaIndex[slug]) + '</span>';
    }).join('');

    var el = document.createElement('article');
    el.className = 'bits-mentors__card';
    el.setAttribute('data-areas', areaSlugs.join(' '));
    el.setAttribute('data-arpa', agencies.map(slugify).join(' '));
    el.setAttribute('data-years', cohorts.years.join(' '));
    el.setAttribute('data-search', [name, affil, exp, areas, bio, cohorts.tokens.join(' ')].join(' ').toLowerCase());
    el.innerHTML =
      '<div class="bits-mentors__card-top">' +
        '<img src="' + esc(headshot) + '" alt="' + esc(name) + '" loading="lazy"' +
             ' style="object-position:' + esc(crop) + '">' +
        '<div>' +
          '<h2 class="bits-mentors__name">' + esc(name) + '</h2>' +
          '<span class="bits-mentors__affiliation">' + esc(affil) + '</span>' +
          (areaHtml ? '<div class="bits-mentors__tags">' + areaHtml + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="bits-mentors__card-body">' +
        (exp ? '<div class="bits-mentors__experience">' + esc(exp) + '</div>' : '') +
        (bio ? '<p class="bits-mentors__bio">' + esc(bio) + '</p>' : '') +
      '</div>' +
      (cohortHtml ? '<div class="bits-mentors__card-footer">' +
                      '<div class="bits-mentors__tags">' + cohortHtml + '</div>' +
                    '</div>' : '');
    return el;
  }

  /* -- populate the two data-driven filters -- */
  function buildAreaFilter() {
    var slugs = Object.keys(areaIndex).sort(function(a, b) {
      return areaIndex[a].localeCompare(areaIndex[b]);
    });
    if (!slugs.length) return;
    slugs.forEach(function(slug) {
      var opt = document.createElement('option');
      opt.value = slug;
      opt.textContent = areaIndex[slug];
      areaSel.appendChild(opt);
    });
    areaRow.classList.remove('bits-mentors__filters--hidden');
  }

  function buildArpaFilter() {
    var present = [];
    for (var i = 0; i < cards.length; i++) {
      (cards[i].getAttribute('data-arpa') || '').split(' ').forEach(function(s) {
        if (s && present.indexOf(s) === -1) present.push(s);
      });
    }
    if (!present.length) return;
    var order = AGENCIES.map(function(a) { return slugify(a[0]); });
    present.sort(function(a, b) { return order.indexOf(a) - order.indexOf(b); });
    present.forEach(function(slug) {
      var label = slug;
      for (var i = 0; i < AGENCIES.length; i++) {
        if (slugify(AGENCIES[i][0]) === slug) { label = AGENCIES[i][0]; break; }
      }
      var btn = document.createElement('button');
      btn.className = 'bits-mentors__pill';
      btn.setAttribute('data-filter', 'arpa');
      btn.setAttribute('data-value', slug);
      btn.textContent = label;
      arpaRow.appendChild(btn);
    });
    arpaRow.classList.remove('bits-mentors__filters--hidden');
    bindPills(arpaRow.querySelectorAll('.bits-mentors__pill[data-filter="arpa"]'));
  }

  /* -- filters -- */
  function applyFilters() {
    var visible = 0;
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var areas = (card.getAttribute('data-areas') || '').split(' ');
      var arpa  = (card.getAttribute('data-arpa')  || '').split(' ');
      var years = (card.getAttribute('data-years') || '').split(' ');
      var matchArea = filters.area === 'all' || areas.indexOf(filters.area) > -1;
      var matchArpa = filters.arpa === 'all' || arpa.indexOf(filters.arpa)  > -1;
      var matchYear = filters.year === 'all' || years.indexOf(filters.year) > -1;
      var matchQ    = !filters.q || (card.getAttribute('data-search') || '').indexOf(filters.q) > -1;
      var show = matchArea && matchArpa && matchYear && matchQ;
      card.style.display = show ? '' : 'none';
      if (show) visible++;
    }
    if (countEl) countEl.textContent = 'Showing ' + visible + ' of ' + cards.length + ' mentors';
    if (emptyEl) emptyEl.style.display = visible === 0 ? 'block' : 'none';
  }

  /* -- alphabetical sort by last name -- */
  function sortGrid() {
    var arr = Array.prototype.slice.call(cards);
    arr.sort(function(a, b) {
      var la = a.querySelector('.bits-mentors__name').textContent.trim().split(' ').pop().toLowerCase();
      var lb = b.querySelector('.bits-mentors__name').textContent.trim().split(' ').pop().toLowerCase();
      return la.localeCompare(lb);
    });
    arr.forEach(function(c) { grid.appendChild(c); });
  }

  /* -- pill filters -- */
  function bindPills(list) {
    for (var i = 0; i < list.length; i++) {
      list[i].addEventListener('click', function() {
        var group = this.getAttribute('data-filter');
        filters[group] = this.getAttribute('data-value');
        var siblings = root.querySelectorAll('.bits-mentors__pill[data-filter="' + group + '"]');
        for (var j = 0; j < siblings.length; j++) siblings[j].classList.remove('bits-mentors__pill--active');
        this.classList.add('bits-mentors__pill--active');
        applyFilters();
      });
    }
  }
  bindPills(root.querySelectorAll('.bits-mentors__pill'));

  /* -- area dropdown -- */
  if (areaSel) {
    areaSel.addEventListener('change', function() {
      filters.area = this.value;
      applyFilters();
    });
  }

  /* -- search box -- */
  if (searchEl) {
    searchEl.addEventListener('input', function() {
      filters.q = this.value.trim().toLowerCase();
      applyFilters();
    });
  }

  /* -- URL param auto-filter, e.g. ?area=synthetic-biology&arpa=darpa&year=2026 -- */
  function applyURLParams() {
    var params = new URLSearchParams(window.location.search);
    ['arpa', 'year'].forEach(function(group) {
      var v = params.get(group);
      if (!v) return;
      var pill = root.querySelector('.bits-mentors__pill[data-filter="' + group + '"][data-value="' + v + '"]');
      if (pill) pill.click();
    });
    var area = params.get('area');
    if (area && areaSel && areaSel.querySelector('option[value="' + area + '"]')) {
      areaSel.value = area;
      filters.area = area;
    }
  }

  /* -- fetch & render -- */
  if (countEl) countEl.textContent = 'Loading mentors...';
  fetch(CSV_URL)
    .then(function(r) { return r.text(); })
    .then(function(text) {
      var rows = parseCSV(text);
      if (!rows.length) throw new Error('empty');
      var map = mapColumns(rows[0]);
      rows.slice(1).forEach(function(r) {
        var card = buildCard(r, map);
        if (card) grid.appendChild(card);
      });
      cards = root.querySelectorAll('.bits-mentors__card');
      sortGrid();
      buildAreaFilter();
      buildArpaFilter();
      applyURLParams();
      applyFilters();
    })
    .catch(function() {
      grid.innerHTML = '<p style="opacity:0.5;padding:1rem 0">Could not load mentors data. Please try refreshing.</p>';
      if (countEl) countEl.textContent = '';
    });
})();
</script>
