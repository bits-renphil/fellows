<!-- BiTS UK Fellows — Squarespace Embed -->
<!-- INSTRUCTIONS:
     1. Paste this entire block into a Squarespace Code Block
     2. Images and PDFs are served from GitHub (github.com/bits-renphil/fellows)
     3. To add new cohorts: copy a card template, change data-cohort="2", fill in details
-->

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet">
<style>
.bits-fellows {
  --bits-accent: #c45c2a;
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  color: inherit;
  line-height: 1.6;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1rem;
}

.bits-fellows__heading {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 3.5rem;
  font-weight: 400;
  letter-spacing: -0.02em;
  color: #1a1a1a;
  margin: 0 0 0.5rem;
  line-height: 1;
}

.bits-fellows__program-link {
  font-size: 0.85rem;
  margin: 0 0 1.75rem;
}

.bits-fellows__program-link a {
  color: var(--bits-accent);
  text-decoration: none;
}

.bits-fellows__program-link a:hover {
  text-decoration: underline;
}

.bits-fellows__filters {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  padding: 1rem 0;
  margin-bottom: 0;
}

.bits-fellows__filter-label {
  font-size: 0.9rem;
  font-weight: 700;
  margin-right: 0.25rem;
  opacity: 0.7;
}

.bits-fellows__pill {
  font-family: 'Inter', sans-serif;
  font-size: 0.82rem;
  font-weight: 500;
  padding: 0.35rem 0.9rem;
  border-radius: 100px;
  border: 1px solid rgba(0,0,0,0.12);
  background: transparent;
  color: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
  opacity: 0.7;
}

.bits-fellows__pill:hover {
  opacity: 1;
  border-color: rgba(0,0,0,0.25);
}

.bits-fellows__pill--active {
  background: var(--bits-accent);
  color: #fff;
  border-color: var(--bits-accent);
  opacity: 1;
}

.bits-fellows__count {
  font-size: 0.82rem;
  opacity: 0.5;
  padding: 0.5rem 0 1rem;
}

.bits-fellows__empty {
  display: none;
  text-align: center;
  padding: 3rem 1rem;
  opacity: 0.5;
  font-size: 0.95rem;
}

.bits-fellows__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2.5rem 2rem;
  align-items: start;
}

.bits-fellows__card {
  background: transparent;
  border: none;
  border-radius: 0;
  overflow: hidden;
}

.bits-fellows__card-top {
  display: block;
  padding: 1.25rem 1.25rem 0;
}

.bits-fellows__card-top img {
  width: 64%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  object-position: center 20%;
  display: block;
  margin: 0 auto;
  border-radius: 50%;
  transition: opacity 0.2s ease;
}

.bits-fellows__card:hover .bits-fellows__card-top img {
  opacity: 0.85;
}

.bits-fellows__name {
  font-size: 1.25rem;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  letter-spacing: -0.01em;
  margin: 1rem 0 0.15rem;
}

.bits-fellows__affiliation {
  font-size: 0.82rem;
  opacity: 0.55;
  display: block;
}

.bits-fellows__tags {
  display: flex;
  gap: 0.4rem;
  margin-top: 0.4rem;
  flex-wrap: wrap;
  justify-content: flex-start;
}

.bits-fellows__tag {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 0.15rem 0.5rem;
  border-radius: 3px;
  background: rgba(0,0,0,0.06);
  color: inherit;
  opacity: 0.55;
}

.bits-fellows__card-body {
  padding: 0.5rem 0 0;
}

.bits-fellows__program {
  font-weight: 700;
  font-size: 0.88rem;
  margin-bottom: 0.3rem;
  opacity: 0.8;
}

.bits-fellows__program-sub {
  font-weight: 300;
}

.bits-fellows__summary {
  font-size: 0.85rem;
  opacity: 0.6;
  line-height: 1.55;
  margin: 0;
}

.bits-fellows__card-footer {
  padding: 0.75rem 0 0;
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  align-items: center;
}

.bits-fellows__card-footer a {
  font-size: 0.8rem;
  color: var(--bits-accent);
  text-decoration: none;
  font-weight: 500;
}

.bits-fellows__card-footer a:hover {
  text-decoration: underline;
}

.bits-fellows__sep {
  opacity: 0.3;
}

.bits-fellows__bio-toggle {
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  color: var(--bits-accent);
  background: none;
  border: none;
  cursor: pointer;
  font-weight: 500;
  padding: 0;
}

.bits-fellows__bio-toggle:hover {
  text-decoration: underline;
}

.bits-fellows__bio {
  display: none;
  font-size: 0.83rem;
  opacity: 0.6;
  line-height: 1.55;
  padding: 0.6rem 0 0;
  border-top: 1px solid rgba(0,0,0,0.08);
  margin-top: 0.6rem;
}

.bits-fellows__bio--open {
  display: block;
}

@media (max-width: 900px) {
  .bits-fellows__grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 540px) {
  .bits-fellows__grid {
    grid-template-columns: 1fr;
    gap: 2rem;
  }
}
</style>

<div class="bits-fellows">

  <h1 class="bits-fellows__heading">BiTS Fellows</h1>
  <p class="bits-fellows__program-link"><a href="https://www.renaissancephilanthropy.org/big-if-true-science-accelerator" target="_blank">Learn more about the program</a></p>

  <!-- Filter Bar -->
  <div class="bits-fellows__filters">
    <span class="bits-fellows__filter-label">Program:</span>
    <button class="bits-fellows__pill bits-fellows__pill--active" data-filter="program" data-value="all">All</button>
    <button class="bits-fellows__pill" data-filter="program" data-value="aria">ARIA</button>
    <button class="bits-fellows__pill" data-filter="program" data-value="sprind">SPRIND</button>
    <button class="bits-fellows__pill" data-filter="program" data-value="americas">Americas</button>
    <button class="bits-fellows__pill" data-filter="program" data-value="japan">Japan</button>
  </div>
  <div class="bits-fellows__filters" style="border-bottom: 1px solid rgba(0,0,0,0.1); padding-top: 0;">
    <span class="bits-fellows__filter-label">Year:</span>
    <button class="bits-fellows__pill bits-fellows__pill--active" data-filter="year" data-value="all">All</button>
    <button class="bits-fellows__pill" data-filter="year" data-value="2025">2025</button>
    <button class="bits-fellows__pill" data-filter="year" data-value="2026">2026</button>
  </div>

  <div class="bits-fellows__count"></div>
  <div class="bits-fellows__empty">No fellows match the selected filter.</div>

  <!-- Card Grid -->
  <div class="bits-fellows__grid">

  </div>
</div>

<script>
(function() {
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR76csPKL8yxjsZNIphHWaDjkubBsX-fsX_PeGYUV-dEAMRkbqkPHs945e8oXSLygh9B6gSwpk5MO4X/pub?output=csv';

  var root = document.querySelector('.bits-fellows');
  if (!root) return;

  var grid    = root.querySelector('.bits-fellows__grid');
  var countEl = root.querySelector('.bits-fellows__count');
  var emptyEl = root.querySelector('.bits-fellows__empty');
  var filters = { program: 'all', year: 'all' };
  var cards   = [];

  /* ── CSV parser ── */
  function parseCSV(text) {
    var rows = [], row = [], field = '', inQ = false, i = 0;
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    while (i < text.length) {
      var c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i+1] === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += c; i++;
      } else {
        if (c === '"')  { inQ = true; i++; continue; }
        if (c === ',')  { row.push(field); field = ''; i++; continue; }
        if (c === '\n') { row.push(field); if (row.some(function(f){return f;})) rows.push(row); row = []; field = ''; i++; continue; }
        field += c; i++;
      }
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  /* ── escape HTML attributes ── */
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── build a card DOM element from a CSV row ── */
  function buildCard(r) {
    var name      = r[0] || '', affil   = r[1] || '';
    var cohort    = (r[2] || '').toLowerCase();
    var year      = r[3] || '';
    var progTitle = r[4] || '', progSub = r[5] || '';
    var summary   = r[6] || '', bio     = r[7] || '';
    var headshot  = r[8] || '', pdfUrl  = r[9] || '', videoUrl = r[10] || '';

    if (!name) return null;

    var tagLabel = { aria:'ARIA', sprind:'SPRIND', americas:'Americas', japan:'Japan' }[cohort] || cohort;

    var progHtml = progTitle;
    if (progSub) progHtml += '<span class="bits-fellows__program-sub">: ' + progSub + '</span>';

    var footerItems = [];
    if (pdfUrl.indexOf('http') === 0) footerItems.push('<a href="' + esc(pdfUrl) + '" target="_blank">Concept Note</a>');
    if (videoUrl.indexOf('http') === 0) footerItems.push('<a href="' + esc(videoUrl) + '" target="_blank">Video</a>');
    footerItems.push('<button class="bits-fellows__bio-toggle">Bio</button>');
    var footerHtml = footerItems.join('<span class="bits-fellows__sep">|</span>');

    var el = document.createElement('article');
    el.className = 'bits-fellows__card';
    el.setAttribute('data-program', cohort);
    el.setAttribute('data-year', year);
    el.innerHTML =
      '<div class="bits-fellows__card-top">' +
        '<img src="' + esc(headshot) + '" alt="' + esc(name) + '" loading="lazy">' +
        '<div>' +
          '<h2 class="bits-fellows__name">' + name + '</h2>' +
          '<span class="bits-fellows__affiliation">' + affil + '</span>' +
          '<div class="bits-fellows__tags">' +
            '<span class="bits-fellows__tag">' + tagLabel + '</span>' +
            '<span class="bits-fellows__tag">' + year + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="bits-fellows__card-body">' +
        '<div class="bits-fellows__program">' + progHtml + '</div>' +
        '<p class="bits-fellows__summary">' + summary + '</p>' +
      '</div>' +
      '<div class="bits-fellows__card-footer">' + footerHtml + '</div>' +
      '<div class="bits-fellows__bio">' + (bio ? '<p>' + bio + '</p>' : '') + '</div>';
    return el;
  }

  /* ── filters ── */
  function applyFilters() {
    var visible = 0;
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var matchProg = filters.program === 'all' || card.getAttribute('data-program') === filters.program;
      var matchYear = filters.year  === 'all' || card.getAttribute('data-year')    === filters.year;
      var show = matchProg && matchYear;
      card.style.display = show ? '' : 'none';
      if (show) visible++;
    }
    if (countEl) countEl.textContent = 'Showing ' + visible + ' of ' + cards.length + ' fellows';
    if (emptyEl) emptyEl.style.display = visible === 0 ? 'block' : 'none';
  }

  /* ── alphabetical sort by last name ── */
  function sortGrid() {
    var arr = Array.prototype.slice.call(cards);
    arr.sort(function(a, b) {
      var la = a.querySelector('.bits-fellows__name').textContent.trim().split(' ').pop().toLowerCase();
      var lb = b.querySelector('.bits-fellows__name').textContent.trim().split(' ').pop().toLowerCase();
      return la.localeCompare(lb);
    });
    arr.forEach(function(c) { grid.appendChild(c); });
  }

  /* ── pill filters ── */
  var pills = root.querySelectorAll('.bits-fellows__pill');
  for (var i = 0; i < pills.length; i++) {
    pills[i].addEventListener('click', function() {
      var group = this.getAttribute('data-filter');
      var value = this.getAttribute('data-value');
      filters[group] = value;
      var siblings = root.querySelectorAll('.bits-fellows__pill[data-filter="' + group + '"]');
      for (var j = 0; j < siblings.length; j++) siblings[j].classList.remove('bits-fellows__pill--active');
      this.classList.add('bits-fellows__pill--active');
      applyFilters();
    });
  }

  /* ── bio toggle ── */
  root.addEventListener('click', function(e) {
    var btn = e.target;
    if (!btn.classList.contains('bits-fellows__bio-toggle')) return;
    var card = btn.closest('.bits-fellows__card');
    var bio  = card.querySelector('.bits-fellows__bio');
    bio.classList.toggle('bits-fellows__bio--open');
    btn.textContent = bio.classList.contains('bits-fellows__bio--open') ? 'Hide Bio' : 'Bio';
  });

  /* ── URL param auto-filter ── */
  function applyURLParams() {
    var params = new URLSearchParams(window.location.search);
    var prog = params.get('program'), year = params.get('year');
    if (prog) {
      var pill = root.querySelector('.bits-fellows__pill[data-filter="program"][data-value="' + prog + '"]');
      if (pill) pill.click();
    }
    if (year) {
      var pill = root.querySelector('.bits-fellows__pill[data-filter="year"][data-value="' + year + '"]');
      if (pill) pill.click();
    }
  }

  /* ── fetch & render ── */
  if (countEl) countEl.textContent = 'Loading fellows…';
  fetch(CSV_URL)
    .then(function(r) { return r.text(); })
    .then(function(text) {
      var rows = parseCSV(text);
      rows.slice(1).forEach(function(r) {
        var card = buildCard(r);
        if (card) grid.appendChild(card);
      });
      cards = root.querySelectorAll('.bits-fellows__card');
      sortGrid();
      applyURLParams();
      applyFilters();
    })
    .catch(function() {
      grid.innerHTML = '<p style="opacity:0.5;padding:1rem 0">Could not load fellows data. Please try refreshing.</p>';
    });
})();
</script>
